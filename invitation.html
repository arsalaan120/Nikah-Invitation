<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Osama & Sana | The Celebrations</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; background:#f5f0eb; }
  body{ -webkit-tap-highlight-color:transparent; }

  .shot{
    position:relative;
    width:100%;
    line-height:0;
    font-size:0;
  }
  .shot img{
    width:100%;
    height:auto;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  /* ── back home button ── */
  #backHome{
    position:fixed;
    top:16px;
    left:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(139,90,43,.75);
    background:rgba(245,240,235,.75);
    backdrop-filter:blur(6px);
    color:#5c3d1e;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    text-decoration:none;
  }
  #backHome:focus-visible{ outline:2px solid #8b5a2b; outline-offset:3px; }

  /* ── back to top button ── */
  #backTop{
    position:fixed;
    right:16px;
    bottom:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(139,90,43,.75);
    background:rgba(245,240,235,.75);
    backdrop-filter:blur(6px);
    color:#5c3d1e;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  #backTop.show{ opacity:1; pointer-events:auto; }

  /* ══════════════════════════════════
     TAP FOR LOCATION — Nikah (Patna)
     Positioned over "TAP FOR LOCATION"
     text at bottom of nikah.jpg
  ══════════════════════════════════ */
  #linkNikah {
    position: absolute;
    left: 25%;
    width: 50%;
    bottom: 2.9%;
    height: 6%;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: block;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ══════════════════════════════════
     TAP FOR LOCATION — Walima (Delhi)
     Positioned over "TAP FOR LOCATION"
     text at bottom of walima.jpg
  ══════════════════════════════════ */
  #linkWalima {
    position: absolute;
    left: 25%;
    width: 50%;
    bottom: 3%;
    height: 6%;
    border-radius: 8px;
    background: transparent;
    border: none;
    cursor: pointer;
    display: block;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Nikah page: red/crimson blink to match its red accents ── */
  @keyframes nikahPulse {
    0%, 100% {
      box-shadow: 0 0 0px 0px rgba(180,20,20,0),
                  inset 0 0 0px 0px rgba(180,20,20,0);
      border-color: rgba(180,20,20,0);
    }
    50% {
      box-shadow: 0 0 10px 3px rgba(180,20,20,0.4),
                  inset 0 0 8px 2px rgba(180,20,20,0.2);
      border-color: rgba(180,20,20,0.55);
    }
  }

  /* ── Walima page: navy/blue blink to match its blue accents ── */
  @keyframes walimaPulse {
    0%, 100% {
      box-shadow: 0 0 0px 0px rgba(60,60,140,0),
                  inset 0 0 0px 0px rgba(60,60,140,0);
      border-color: rgba(60,60,140,0);
    }
    50% {
      box-shadow: 0 0 10px 3px rgba(60,60,140,0.4),
                  inset 0 0 8px 2px rgba(60,60,140,0.2);
      border-color: rgba(60,60,140,0.55);
    }
  }

  #linkNikah {
    border: 2.5px solid rgba(180,20,20,0);
    animation: nikahPulse 2s ease-in-out infinite;
  }
  #linkWalima {
    border: 2.5px solid rgba(60,60,140,0);
    animation: walimaPulse 2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    #linkNikah, #linkWalima { animation: none; }
  }

  /* ══════════════════════════════════
     COUNTDOWN on closing.jpg
     "until we say Qubool Hai" slide
  ══════════════════════════════════ */
  .cd-num {
    position: absolute;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(16px, 7vw, 70px);
    color: #2a1a0a;
    line-height: 1;
    transition: opacity .15s ease;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .cd-num.flip { opacity: 0.2; }

  /* adjust top/left after checking your closing.jpg boxes */
  #cd-days  { top: 71.5%; left: 24%; }
  #cd-hours { top: 71.5%; left: 41%; }
  #cd-mins  { top: 71.5%; left: 58%; }
  #cd-secs  { top: 71.5%; left: 75%; }

</style>
</head>
<body>

  <a id="backHome" href="index.html" aria-label="Back to start">‹</a>

  <!-- Slide 1: Intro — Osama Khan & Sana Perween -->
  <div class="shot" id="intro">
    <img src="assets/intro.jpg" alt="We request the honor of your presence at the Wedding Ceremony of Osama Khan and Sana Perween">
  </div>

  <!-- Slide 2: Nikah — 11 Nov 2026 — TAP FOR LOCATION → Patna -->
  <div class="shot" id="nikah">
    <img src="assets/nikah.jpg" alt="Save the date — Nikah of Sana and Osama — 11th November 2026 — Tap for Location">
    <a id="linkNikah" href="https://maps.app.goo.gl/ALRqB4v89ENVpJAg7?g_st=ac"
       target="_blank" rel="noopener" aria-label="Open Nikah venue in Google Maps — Patna"></a>
  </div>

  <!-- Slide 3: Walima/Reception — 15 Nov 2026 — TAP FOR LOCATION → Delhi -->
  <div class="shot" id="walima">
    <img src="assets/walima.jpg" alt="Save the date — Reception of Sana and Osama — 15th November 2026 — Tap for Location">
    <a id="linkWalima" href="https://maps.app.goo.gl/q4iDBPgT9Ah7VEGJ7?g_st=ac"
       target="_blank" rel="noopener" aria-label="Open Walima venue in Google Maps — Delhi"></a>
  </div>

  <!-- Slide 4: Closing — Family Friends + countdown -->
  <div class="shot" id="closing">
    <img src="assets/closing.jpg" alt="With best wishes from Family, Friends and Relatives — until we say Qubool Hai">
    <span class="cd-num" id="cd-days">--</span>
    <span class="cd-num" id="cd-hours">--</span>
    <span class="cd-num" id="cd-mins">--</span>
    <span class="cd-num" id="cd-secs">--</span>
  </div>

  <button id="backTop" type="button" aria-label="Back to top">↑</button>

<script>
  (function(){

    /* ── back to top ── */
    var backTop = document.getElementById('backTop');
    if(backTop){
      window.addEventListener('scroll', function(){
        backTop.classList.toggle('show', window.scrollY > 400);
      },{passive:true});
      backTop.addEventListener('click', function(){
        window.scrollTo({top:0, behavior:'smooth'});
      });
    }

    /* ── countdown: Nikah 11 November 2026 ── */
    var TARGET   = new Date('2026-11-11T19:00:00');
    var elDays   = document.getElementById('cd-days');
    var elHours  = document.getElementById('cd-hours');
    var elMins   = document.getElementById('cd-mins');
    var elSecs   = document.getElementById('cd-secs');
    var prevSecs = -1;

    function pad(n){ return String(n).padStart(2,'0'); }

    function flash(el){
      el.classList.add('flip');
      setTimeout(function(){ el.classList.remove('flip'); }, 150);
    }

    function tick(){
      var diff = TARGET - new Date();

      if(diff <= 0){
        elDays.textContent = elHours.textContent = elMins.textContent = elSecs.textContent = '00';
        return;
      }

      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000)  / 60000);
      var s = Math.floor((diff % 60000)    / 1000);

      if(s !== prevSecs){
        flash(elSecs);
        if(s === 59)             flash(elMins);
        if(s === 59 && m === 59) flash(elHours);
        if(s === 59 && m === 59 && h === 23) flash(elDays);
        prevSecs = s;
      }

      elDays.textContent  = pad(d);
      elHours.textContent = pad(h);
      elMins.textContent  = pad(m);
      elSecs.textContent  = pad(s);

      requestAnimationFrame(tick);
    }

    tick();

  })();
</script>

</body>
</html>
