<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Osama & Sana | The Celebrations</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ width:100%; background:#1c0306; }
  body{ -webkit-tap-highlight-color:transparent; }

  .shot{
    position:relative;
    width:100%;
    line-height:0;
    font-size:0;
  }
  .shot img{
    width:100%;
    height:auto;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }

  .hot{
    position:absolute;
    background:transparent;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    display:block;
  }
  .hot:focus-visible{
    outline:2px solid rgba(227,201,138,.9);
    outline-offset:3px;
    border-radius:14px;
  }
  .hot:active{ background:rgba(227,201,138,.12); }

  /* ── map tap zones ── */
  #linkPatna{
    left:51.60%;
    width:33.60%;
    top:19.40%;
    height:26.00%;
    border-radius:18px;
  }
  #linkDelhi{
    left:16.50%;
    width:33.57%;
    top:66.50%;
    height:23.50%;
    border-radius:18px;
  }

  /* ── BOTH blink together, bright maroon ── */
  @keyframes mapPulse {
    0%, 100% {
      box-shadow: 0 0 0px 0px rgba(180,120,80,0),
                  inset 0 0 0px 0px rgba(180,120,80,0);
      border-color: rgba(180,120,80,0);
      background: rgba(180,120,80,0);
    }
    50% {
      box-shadow: 0 0 8px 2px rgba(160,100,60,0.35),
                  inset 0 0 10px 3px rgba(160,100,60,0.22);
      border-color: rgba(160,100,60,0.5);
      background: rgba(160,100,60,0.04);
    }
  }

  #linkPatna,
  #linkDelhi {
    border: 3px solid rgba(160,100,60,0);
    border-radius: 18px;
    animation: mapPulse 2s ease-in-out infinite;
  }

  @media (prefers-reduced-motion: reduce){
    #linkPatna, #linkDelhi { animation: none; }
  }

  /* ── back home button ── */
  #backHome{
    position:fixed;
    top:16px;
    left:16px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(227,201,138,.75);
    background:rgba(20,4,6,.55);
    backdrop-filter:blur(6px);
    color:#e3c98a;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    text-decoration:none;
  }
  #backHome:focus-visible{ outline:2px solid #e3c98a; outline-offset:3px; }

  /* ── back to top button ── */
  #backTop{
    position:fixed;
    right:16px;
    bottom:18px;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(227,201,138,.75);
    background:rgba(20,4,6,.55);
    backdrop-filter:blur(6px);
    color:#e3c98a;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:50;
    opacity:0;
    pointer-events:none;
    transition:opacity .35s ease;
  }
  #backTop.show{ opacity:1; pointer-events:auto; }
  #backTop:focus-visible{ outline:2px solid #e3c98a; outline-offset:3px; }

  /* ── each countdown number pinned to its own box ── */
  .cd-num {
    position: absolute;
    font-family: 'Cinzel', serif;
    font-weight: 600;
    font-size: clamp(18px, 7vw, 60px);
    color: #3b1505;
    line-height: 1;
    transition: opacity .15s ease;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .cd-num.flip { opacity: 0.2; }

  #cd-days  { top: 84%; left: 24%; }
  #cd-hours { top: 84%; left: 41%; }
  #cd-mins  { top: 84%; left: 56%; }
  #cd-secs  { top: 84%; left: 73%; }
</style>
</head>
<body>

  <a id="backHome" href="index.html" aria-label="Back to start">‹</a>

  <!-- Slide 1: Intro -->
  <div class="shot" id="intro">
    <img src="assets/intro.jpg" alt="Osama and Sana — Nikah 11th November 2026, Walima 15th November 2026">
  </div>

  <!-- Slide 2: Celebrations -->
  <div class="shot" id="celebrations">
    <img src="assets/celebrations.jpg" alt="Nikah and Walima ceremony details, dates, times and venue">
  </div>

  <!-- Slide 3: City Maps — blinking glow on both cards -->
  <div class="shot" id="cityMaps">
    <img src="assets/citymaps.jpg" alt="Illustrated maps of Patna and Delhi">
    <a class="hot" id="linkPatna" href="#" target="_blank" rel="noopener" aria-label="Open Patna location in Google Maps"></a>
    <a class="hot" id="linkDelhi" href="#" target="_blank" rel="noopener" aria-label="Open Delhi location in Google Maps"></a>
  </div>

  <!-- Slide 4: Countdown — numbers inside 4 golden boxes -->
  <div class="shot" id="closing">
    <img src="assets/countdown.jpg" alt="Waiting for your gracious presence — Until we say Qubool Hai">
    <span class="cd-num" id="cd-days">--</span>
    <span class="cd-num" id="cd-hours">--</span>
    <span class="cd-num" id="cd-mins">--</span>
    <span class="cd-num" id="cd-secs">--</span>
  </div>

  <!-- Slide 5: Quranic verse -->
  <div class="shot" id="lastSlide">
    <img src="assets/last.jpg" alt="Surah Al-A'raf 7:189 — It is He who created you from one soul and created from it its mate">
  </div>

  <button id="backTop" type="button" aria-label="Back to top">↑</button>

<script>
  (function(){

    /* ── maps ── */
    var address = "Haroon Nagar Community Hall Sector 2, Haroon Colony Sector -Il, Phulwari Sharif, Patna, Bihar 800002";
    var mapsUrl = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(address);

    var linkMaps = document.getElementById('linkMaps');
    if(linkMaps) linkMaps.href = mapsUrl;

    var linkQR = document.getElementById('linkQR');
    if(linkQR) linkQR.href = mapsUrl;

    var linkDelhi = document.getElementById('linkDelhi');
    if(linkDelhi) linkDelhi.href = "https://maps.app.goo.gl/q4iDBPgT9Ah7VEGJ7?g_st=ac";

    var linkPatna = document.getElementById('linkPatna');
    if(linkPatna) linkPatna.href = "https://maps.app.goo.gl/ALRqB4v89ENVpJAg7?g_st=ac";

    /* ── back to top ── */
    var backTop = document.getElementById('backTop');
    if(backTop){
      window.addEventListener('scroll', function(){
        backTop.classList.toggle('show', window.scrollY > 400);
      },{passive:true});
      backTop.addEventListener('click', function(){
        window.scrollTo({top:0, behavior:'smooth'});
      });
    }

    /* ── countdown: Nikah 11 November 2026 ── */
    var TARGET   = new Date('2026-11-11T00:00:00');
    var elDays   = document.getElementById('cd-days');
    var elHours  = document.getElementById('cd-hours');
    var elMins   = document.getElementById('cd-mins');
    var elSecs   = document.getElementById('cd-secs');
    var prevSecs = -1;

    function pad(n){ return String(n).padStart(2,'0'); }

    function flash(el){
      el.classList.add('flip');
      setTimeout(function(){ el.classList.remove('flip'); }, 150);
    }

    function tick(){
      var diff = TARGET - new Date();

      if(diff <= 0){
        elDays.textContent = elHours.textContent = elMins.textContent = elSecs.textContent = '00';
        return;
      }

      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000)  / 60000);
      var s = Math.floor((diff % 60000)    / 1000);

      if(s !== prevSecs){
        flash(elSecs);
        if(s === 59)             flash(elMins);
        if(s === 59 && m === 59) flash(elHours);
        if(s === 59 && m === 59 && h === 23) flash(elDays);
        prevSecs = s;
      }

      elDays.textContent  = pad(d);
      elHours.textContent = pad(h);
      elMins.textContent  = pad(m);
      elSecs.textContent  = pad(s);

      requestAnimationFrame(tick);
    }

    tick();

  })();
</script>

</body>
</html>
